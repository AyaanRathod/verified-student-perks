<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deal · PerkCheck</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html"><i>✓</i>PerkCheck</a>
    <nav class="links">
      <a href="results.html">Perks</a>
      <button class="mode" type="button" id="theme" aria-label="Switch color mode">☾</button>
    </nav>
  </header>
  <main class="wrap page" id="deal"></main>
  <footer>PerkCheck does not store your email.</footer>
  <script src="deals.js"></script>
  <script src="app.js"></script>
  <script>
    var id = new URLSearchParams(location.search).get("id");
    var deal = (window.PERKCHECK_DEALS || []).find(function (item) { return item.id === id; });
    var box = document.getElementById("deal");
    if (!deal) {
      box.innerHTML = '<p>This deal is not in the file. <a class="back" href="index.html">Go back</a></p>';
    } else {
      document.title = deal.brand + " · PerkCheck";
      var excluded = (deal.not_available_in || []).map(function (item) {
        return '<a href="' + item.source + '">Not in ' + item.country + '</a>';
      }).join(" · ");
      var issue = "https://github.com/AyaanRathod/verified-student-perks/issues/new?title=" + encodeURIComponent("Broken: " + deal.id);
      box.innerHTML =
        '<p><a class="back" href="results.html">Back to perks</a></p>' +
        '<article class="deal">' +
          '<div class="brand">' + escapeHtml(deal.brand) + "</div>" +
          "<h1>" + escapeHtml(deal.title) + "</h1>" +
          '<div class="row">' + countryBadges(deal) + priceBadge(deal) + "</div>" +
          '<div class="row"><span class="badge chip">Checked ' + formatDate(deal.last_verified) + "</span></div>" +
          "<p>" + escapeHtml(deal.email_rules || "") + "</p>" +
          (excluded ? "<p>" + excluded + "</p>" : "") +
          "<h2>How to claim</h2><ol class=\"steps\">" +
            (deal.how_to_claim || []).map(function (step) { return "<li>" + escapeHtml(step) + "</li>"; }).join("") +
          "</ol>" +
          '<p class="note">' + escapeHtml(deal.source_note || "") + "</p>" +
          '<div class="foot"><a class="btn" href="' + deal.official_url + '">Official page</a>' +
          (deal.affiliate_url ? '<a class="btn" href="' + deal.affiliate_url + '">Paid link</a><span class="paid">Paid link</span>' : "") +
          '<a href="' + issue + '">Report a broken deal</a></div>' +
        "</article>";
    }
  </script>
</body>
</html>
