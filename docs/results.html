<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your perks · PerkCheck</title>
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html"><i>✓</i>PerkCheck</a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a class="repo" href="https://github.com/AyaanRathod/verified-student-perks" aria-label="Star PerkCheck on GitHub"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg></a>
      <button class="mode" type="button" id="theme" aria-label="Switch color mode">☾</button>
    </nav>
  </header>
  <div class="wrap">
    <p class="banner" id="banner">Enter your school email to see your perks.</p>
    <p class="note" id="school-list-notice" hidden></p>
    <nav class="cat-bar" id="cat-bar" hidden aria-label="Categories"></nav>
    <div class="layout">
      <aside>
        <details class="filters" id="filters">
          <summary>Filters</summary>
          <h2>Price</h2>
          <label class="opt"><input type="checkbox" name="price" value="free" checked> Free</label>
          <label class="opt"><input type="checkbox" name="price" value="discount" checked> Discounted</label>
          <h2>Free period</h2>
          <label class="opt"><input type="radio" name="months" value="0" checked> Any</label>
          <label class="opt"><input type="radio" name="months" value="3"> 3 months or more</label>
          <label class="opt"><input type="radio" name="months" value="6"> 6 months or more</label>
          <label class="opt"><input type="radio" name="months" value="12"> 12 months or more</label>
          <h2>How you verify</h2>
          <div id="verifications"></div>
        </details>
      </aside>
      <main>
        <div class="top" id="catalog"><h2 id="count">Perks</h2></div>
        <section class="featured" id="featured" hidden>
          <div class="section-head">
            <h2>Featured</h2>
            <span class="swipe-hint" id="swipe-hint" hidden>swipe →</span>
          </div>
          <div class="featured-row" id="featured-row"></div>
        </section>
        <div id="fits"></div>
        <details class="blocked" id="blocked-details" hidden>
          <summary id="blocked-summary"></summary>
          <div class="grid" id="blocked"></div>
        </details>
      </main>
    </div>
  </div>
  <footer>Each perk says how it was verified. The brand makes the final check.</footer>
  <script src="deals.js?v=5"></script>
  <script src="app.js?v=9"></script>
  <script>
    var email = "";
    var schools = null;
    var regionNames = new Intl.DisplayNames(["en"], { type: "region" });

    function regionName(code) {
      try { return regionNames.of(code) || code; } catch (error) { return code; }
    }

    function emailDomain(value) {
      var text = String(value || "").trim().toLowerCase();
      var at = text.lastIndexOf("@");
      if (at === -1) return "";
      return text.slice(at + 1);
    }

    function storedEmail() {
      try {
        var saved = sessionStorage.getItem("perkcheck-email");
        if (saved) return saved.trim().toLowerCase();
      } catch (error) {}
      return (new URLSearchParams(location.search).get("email") || "").trim().toLowerCase();
    }

    function readVisit() {
      email = storedEmail();
    }

    function showSchoolListNotice() {
      var notice = document.getElementById("school-list-notice");
      if (!schoolListFromFallback) {
        notice.hidden = true;
        notice.textContent = "";
        return;
      }
      notice.hidden = false;
      notice.textContent = "The school list did not load. Only a few schools are recognized right now. Try again later.";
    }

    document.getElementById("verifications").innerHTML = Object.keys(verifyNames).map(function (name) {
      return '<label class="opt"><input type="checkbox" name="verification" value="' + name + '" checked> ' + verifyNames[name] + "</label>";
    }).join("");

    var filterPanel = document.getElementById("filters");
    var wideFilters = window.matchMedia("(min-width: 801px)");
    function syncFilters() {
      filterPanel.open = wideFilters.matches;
    }
    syncFilters();
    wideFilters.addEventListener("change", syncFilters);
    filterPanel.addEventListener("toggle", function () {
      if (wideFilters.matches) filterPanel.open = true;
    });

    document.querySelector("aside").addEventListener("change", draw);
    document.getElementById("cat-bar").addEventListener("click", function (event) {
      var button = event.target.closest(".cat-chip");
      if (!button) return;
      var target = document.getElementById(button.getAttribute("data-target"));
      if (!target) return;
      markChip(button.getAttribute("data-target"));
      if (target === filterPanel) target.open = true;
      target.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    (function () {
      var row = document.getElementById("featured-row");
      var startX = 0;
      var startLeft = 0;
      var dragged = false;
      row.addEventListener("pointerdown", function (event) {
        if (event.pointerType === "touch") return;
        startX = event.clientX;
        startLeft = row.scrollLeft;
        dragged = false;
        row.setPointerCapture(event.pointerId);
      });
      row.addEventListener("pointermove", function (event) {
        if (!row.hasPointerCapture(event.pointerId)) return;
        var delta = event.clientX - startX;
        if (Math.abs(delta) > 6) dragged = true;
        row.scrollLeft = startLeft - delta;
      });
      row.addEventListener("click", function (event) {
        if (!dragged) return;
        event.preventDefault();
        event.stopPropagation();
        dragged = false;
      }, true);
    })();

    loadSchools().then(function (list) {
      schools = list;
      showSchoolListNotice();
      readVisit();
      draw();
    });

    var sectionObserver = null;

    function markChip(targetId) {
      Array.prototype.forEach.call(document.querySelectorAll(".cat-chip"), function (chip) {
        if (chip.getAttribute("data-target") === targetId) chip.setAttribute("aria-current", "true");
        else chip.removeAttribute("aria-current");
      });
    }

    function inCategory(deal, key) {
      // GitHub Pack is a source, not only a category. Termius stays under Coding tools
      // and also shows under GitHub Pack. Other chips still match the category field.
      if (key === "github-pack") return deal.category === "github-pack" || deal.github_pack === true;
      return deal.category === key;
    }

    function renderCatBar(fits) {
      // fits.length is one count per deal. A deal in two sections is not counted twice.
      var buttons = ['<button type="button" class="cat-chip" data-target="catalog" aria-current="true">All ' + fits.length + "</button>"];
      Object.keys(CATEGORY_LABELS).forEach(function (key) {
        var count = fits.filter(function (deal) { return inCategory(deal, key); }).length;
        if (!count) return;
        buttons.push('<button type="button" class="cat-chip" data-target="cat-' + key + '">' + escapeHtml(CATEGORY_LABELS[key]) + "</button>");
      });
      buttons.push('<button type="button" class="cat-chip" data-target="filters">Filters</button>');
      var bar = document.getElementById("cat-bar");
      bar.hidden = false;
      bar.innerHTML = buttons.join("");
    }

    function watchSections() {
      if (sectionObserver) sectionObserver.disconnect();
      var nodes = document.querySelectorAll("#featured, .cat-section");
      if (!nodes.length) return;
      sectionObserver = new IntersectionObserver(function (entries) {
        var visible = entries.filter(function (entry) { return entry.isIntersecting; });
        if (!visible.length) return;
        visible.sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
        var id = visible[0].target.id;
        markChip(id === "featured" ? "catalog" : id);
      }, { rootMargin: "-130px 0px -55% 0px", threshold: 0.1 });
      Array.prototype.forEach.call(nodes, function (node) { sectionObserver.observe(node); });
    }

    function updateSwipeHint() {
      var row = document.getElementById("featured-row");
      var hint = document.getElementById("swipe-hint");
      hint.hidden = row.scrollWidth <= row.clientWidth + 1;
    }
    window.addEventListener("resize", updateSwipeHint);

    function draw() {
      var domain = emailDomain(email);
      var school = schools ? findSchool(domain, schools) : null;
      var banner = document.getElementById("banner");
      var details = document.getElementById("blocked-details");
      var fitsBox = document.getElementById("fits");
      var blockedBox = document.getElementById("blocked");
      var featuredBox = document.getElementById("featured");
      var bar = document.getElementById("cat-bar");
      if (!email || !school) {
        banner.textContent = email
          ? domain + " is not a school email we can find. Use the email your school gave you, like name@brocku.ca. "
          : "Enter your school email to see your perks. ";
        var home = document.createElement("a");
        home.href = "index.html";
        home.textContent = "Back to home";
        banner.appendChild(home);
        document.getElementById("count").textContent = "Perks";
        bar.hidden = true;
        bar.innerHTML = "";
        featuredBox.hidden = true;
        document.getElementById("featured-row").innerHTML = "";
        fitsBox.innerHTML = "";
        details.hidden = true;
        blockedBox.innerHTML = "";
        return;
      }

      var country = school.alpha_two_code;
      var place = regionName(country);
      banner.innerHTML = "<b>" + escapeHtml(domain) + "</b> matches " + escapeHtml(school.name) + " (" + escapeHtml(place) + ").";

      var active = window.PERKCHECK_DEALS.filter(function (deal) { return deal.status === "active"; });
      var fits = [];
      var blocked = [];
      active.forEach(function (deal) {
        if (!schoolListAllows(deal, domain)) return;
        if (isBlocked(deal, country)) blocked.push(deal);
        else if (fitsCountry(deal, country) && passesFilters(deal, true)) fits.push(deal);
      });
      blocked = blocked.filter(function (deal) { return passesFilters(deal, false); });
      document.getElementById("count").textContent = fits.length + (fits.length === 1 ? " perk for this email" : " perks for this email");
      renderCatBar(fits);

      var featured = fits.filter(function (deal) { return deal.featured === true; }).sort(function (a, b) {
        return (a.featured_rank || 1000) - (b.featured_rank || 1000);
      });
      if (!featured.length) {
        featuredBox.hidden = true;
        document.getElementById("featured-row").innerHTML = "";
        document.getElementById("swipe-hint").hidden = true;
      } else {
        featuredBox.hidden = false;
        renderCards(document.getElementById("featured-row"), featured, { country: country, schoolName: school.name, blocked: false, featured: true });
        updateSwipeHint();
      }

      var cardOptions = { country: country, schoolName: school.name, blocked: false };
      if (!fits.length) fitsBox.innerHTML = '<p class="empty">No checked deal matches these filters.</p>';
      else {
        fitsBox.innerHTML = Object.keys(CATEGORY_LABELS).filter(function (key) {
          return fits.some(function (deal) { return inCategory(deal, key); });
        }).map(function (key) {
          var count = fits.filter(function (deal) { return inCategory(deal, key); }).length;
          return '<section class="cat-section" id="cat-' + key + '"><h2>' + escapeHtml(CATEGORY_LABELS[key]) + " · " + count + '</h2><div class="grid"></div></section>';
        }).join("");
        Object.keys(CATEGORY_LABELS).forEach(function (key) {
          var section = document.getElementById("cat-" + key);
          if (!section) return;
          renderCards(section.querySelector(".grid"), fits.filter(function (deal) { return inCategory(deal, key); }), cardOptions);
        });
      }
      watchSections();
      if (!blocked.length) {
        details.hidden = true;
        blockedBox.innerHTML = "";
      } else {
        details.hidden = false;
        document.getElementById("blocked-summary").textContent = blocked.length + (blocked.length === 1 ? " deal" : " deals") + " not available in " + place;
        renderCards(blockedBox, blocked, { country: country, schoolName: school.name, blocked: true });
      }
    }

    function selected(name) {
      return Array.prototype.map.call(document.querySelectorAll('input[name="' + name + '"]:checked'), function (box) {
        return box.value;
      });
    }

    function passesFilters(deal) {
      var prices = selected("price");
      var verifies = selected("verification");
      var minMonths = Number((document.querySelector('input[name="months"]:checked') || {}).value || 0);
      if (prices.indexOf(deal.price_type) === -1) return false;
      if (verifies.indexOf(deal.verification) === -1) return false;
      if (minMonths && !(deal.free_months >= minMonths)) return false;
      return true;
    }
  </script>
</body>
</html>
