<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your perks · PerkCheck</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html"><i>✓</i>PerkCheck</a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a class="repo" href="https://github.com/AyaanRathod/verified-student-perks" aria-label="Star PerkCheck on GitHub"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg></a>
      <button class="mode" type="button" id="theme" aria-label="Switch color mode">☾</button>
    </nav>
  </header>
  <div class="wrap">
    <p class="banner" id="banner">Enter a school email on the home page.</p>
    <div class="layout">
      <aside>
        <h2>Country</h2>
        <label class="opt"><input type="checkbox" name="country" value="CA" checked> Canada</label>
        <label class="opt"><input type="checkbox" name="country" value="US"> United States</label>
        <h2>Price</h2>
        <label class="opt"><input type="checkbox" name="price" value="free" checked> Free</label>
        <label class="opt"><input type="checkbox" name="price" value="discount" checked> Discounted</label>
        <h2>Free period</h2>
        <label class="opt"><input type="radio" name="months" value="0" checked> Any</label>
        <label class="opt"><input type="radio" name="months" value="3"> 3 months or more</label>
        <label class="opt"><input type="radio" name="months" value="6"> 6 months or more</label>
        <label class="opt"><input type="radio" name="months" value="12"> 12 months or more</label>
        <h2>Category</h2>
        <div id="categories"></div>
        <h2>How you verify</h2>
        <div id="verifications"></div>
      </aside>
      <main>
        <div class="top"><h2 id="count">Perks</h2></div>
        <div class="grid" id="fits"></div>
        <h2 id="blocked-title" hidden>Not for this email</h2>
        <div class="grid" id="blocked"></div>
      </main>
    </div>
  </div>
  <footer>A result is “likely eligible”. The brand makes the final check.</footer>
  <script src="deals.js?v=2"></script>
  <script src="app.js?v=3"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var email = (params.get("email") || "").trim().toLowerCase();
    var picked = params.get("country") === "US" ? "US" : "CA";
    var schools = null;

    var categories = ["dev-tools", "design", "productivity", "music-video", "ai-tools", "shopping", "banking"];
    var verifyNames = {
      "school-email": "School email",
      "sheerid": "SheerID",
      "unidays": "UNiDAYS",
      "student-beans": "Student Beans",
      "id-upload": "ID upload",
      "other": "Other"
    };
    document.getElementById("categories").innerHTML = categories.map(function (name) {
      return '<label class="opt"><input type="checkbox" name="category" value="' + name + '" checked> ' + name + "</label>";
    }).join("");
    document.getElementById("verifications").innerHTML = Object.keys(verifyNames).map(function (name) {
      return '<label class="opt"><input type="checkbox" name="verification" value="' + name + '" checked> ' + verifyNames[name] + "</label>";
    }).join("");

    document.querySelector("aside").addEventListener("change", draw);

    loadSchools().then(function (list) {
      schools = list;
      if (email) {
        var school = findSchool(email.split("@")[1] || "", schools);
        if (school) picked = school.alpha_two_code === "US" ? "US" : (school.alpha_two_code === "CA" ? "CA" : picked);
      }
      document.querySelectorAll('input[name="country"]').forEach(function (box) {
        box.checked = box.value === picked;
      });
      draw();
    });

    function draw() {
      var domain = email.split("@")[1] || "";
      var school = schools ? findSchool(domain, schools) : null;
      var country = school ? school.alpha_two_code : picked;
      var banner = document.getElementById("banner");
      if (!email) {
        banner.textContent = "No email yet. This is a preview of the checked deals. Pick a country in the filter.";
      } else if (!school) {
        banner.textContent = domain + " is not in the public school list. The list below is a preview for " + (country === "CA" ? "Canada" : country) + ".";
      } else {
        banner.innerHTML = "<b>" + domain + "</b> matches " + school.name + " (" + school.alpha_two_code + "). These deals are likely eligible. The brand makes the final check.";
      }

      var active = window.PERKCHECK_DEALS.filter(function (deal) { return deal.status === "active"; });
      var fits = [];
      var blocked = [];
      active.forEach(function (deal) {
        if (isBlocked(deal, country)) blocked.push(deal);
        else if (fitsCountry(deal, country) && passesFilters(deal, true)) fits.push(deal);
      });
      blocked = blocked.filter(function (deal) { return passesFilters(deal, false); });
      document.getElementById("count").textContent = fits.length + (fits.length === 1 ? " perk for this email" : " perks for this email");
      var fitsBox = document.getElementById("fits");
      if (!fits.length) fitsBox.innerHTML = '<p class="empty">No checked deal matches these filters.</p>';
      else renderCards(fitsBox, fits);
      var title = document.getElementById("blocked-title");
      title.hidden = blocked.length === 0;
      renderCards(document.getElementById("blocked"), blocked, true);
    }

    function selected(name) {
      return Array.prototype.map.call(document.querySelectorAll('input[name="' + name + '"]:checked'), function (box) {
        return box.value;
      });
    }

    function passesFilters(deal, useCountry) {
      var countries = selected("country");
      var prices = selected("price");
      var cats = selected("category");
      var verifies = selected("verification");
      var minMonths = Number((document.querySelector('input[name="months"]:checked') || {}).value || 0);
      if (useCountry && countries.length && !deal.countries.some(function (code) { return countries.indexOf(code) !== -1; })) return false;
      if (prices.indexOf(deal.price_type) === -1) return false;
      if (cats.indexOf(deal.category) === -1) return false;
      if (verifies.indexOf(deal.verification) === -1) return false;
      if (minMonths && !(deal.free_months >= minMonths)) return false;
      return true;
    }
  </script>
</body>
</html>
