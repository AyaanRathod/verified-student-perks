# Published deals. An active row was checked on the official page named in source_note.
# The Monday Grok bot files leads in data/inbox/candidates.yaml. Those stay out of this file
# until the brand's own page has been checked.
#
# Style B banner fields (not checked by the current validator yet):
#   logo: file name in docs/logos/, or null when the brand has no Simple Icons logo
#         (the site then shows the brand name as text on a neutral banner)
#   banner_color: banner background, hex like "#181717"
#   logo_color: optional fill for single-colour logos, hex
# Categories: github-pack, ai, coding, cloud, design, notes, learning, shopping
# Other new optional fields:
#   ca_school_email_source: page that shows a Canadian school email works
#   schools: limit a deal to these school email domains (campus licences)
#   featured: true or false. At most 4 deals in this file may be featured.
#   featured_rank: a positive whole number, only when featured is true

- id: github-student-pack
  brand: GitHub
  title: Student Developer Pack, free developer tools while you're a student
  category: github-pack
  featured: true
  featured_rank: 1
  price_type: free
  free_months: null
  countries: [CA, US]
  ca_school_email: accepted
  verification: school-email
  email_rules: Academic email when the school issues one, otherwise proof of enrollment. A .edu address is not required.
  how_to_claim:
  - Open your GitHub Education benefits settings
  - Under GitHub Education, start an application
  - Add and verify your school email if asked, or upload proof of enrollment
  - Submit the application and wait for approval
  official_url: https://education.github.com/pack
  affiliate_url: null
  source_note: 'sourced: https://docs.github.com/en/education/about-github-education/github-education-for-students/apply-to-github-education-as-a-student'
  last_verified: 2026-10-22
  watch_text: Student Developer Pack
  status: active
  logo: github.svg
  banner_color: '#181717'
  logo_color: '#FFFFFF'
  ca_school_email_source: https://docs.github.com/en/education/about-github-education/github-education-for-students/apply-to-github-education-as-a-student

