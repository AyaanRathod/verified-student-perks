<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="PerkCheck: Find out what your school email actually gets you.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <style>
      .f { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="1130" cy="60" r="170" fill="#ffffff" opacity="0.06"/>
  <circle cx="1210" cy="360" r="120" fill="#ffffff" opacity="0.07"/>
  <!-- check mark logo -->
  <g transform="translate(96,112)">
    <rect width="72" height="72" rx="18" fill="#ffffff"/>
    <path d="M20 37 L32 49 L54 25" fill="none" stroke="#0F766E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="190" y="166" class="f" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">PerkCheck</text>
  <text x="96" y="250" class="f" font-size="38" font-weight="600" fill="#ffffff" letter-spacing="-0.5">Find out what your school email actually gets you.</text>
  <text x="96" y="296" class="f" font-size="22" font-weight="400" fill="#CCFBF1">Student perks checked for Canada and the US, with a last verified date on every deal.</text>
  <!-- CA badge -->
  <g transform="translate(96,322)">
    <rect width="104" height="40" rx="20" fill="#ffffff"/>
    <g transform="translate(14,10)">
      <rect width="30" height="20" rx="3" fill="#ffffff" stroke="#E5E7EB"/>
      <rect width="8" height="20" fill="#D52B1E"/>
      <rect x="22" width="8" height="20" fill="#D52B1E"/>
      <path d="M15 4 L17 8 L20 7 L18.5 11 L21 12 L15 16 L9 12 L11.5 11 L10 7 L13 8 Z" fill="#D52B1E"/>
    </g>
    <text x="54" y="27" class="f" font-size="18" font-weight="700" fill="#0F766E">CA</text>
  </g>
  <!-- US badge -->
  <g transform="translate(212,322)">
    <rect width="104" height="40" rx="20" fill="#ffffff"/>
    <g transform="translate(14,10)">
      <rect width="30" height="20" rx="3" fill="#ffffff" stroke="#E5E7EB"/>
      <rect y="0" width="30" height="2.9" fill="#B22234"/>
      <rect y="5.7" width="30" height="2.9" fill="#B22234"/>
      <rect y="11.4" width="30" height="2.9" fill="#B22234"/>
      <rect y="17.1" width="30" height="2.9" fill="#B22234"/>
      <rect width="13" height="11" fill="#3C3B6E"/>
    </g>
    <text x="54" y="27" class="f" font-size="18" font-weight="700" fill="#0F766E">US</text>
  </g>
  <g transform="translate(330,322)">
    <rect width="290" height="40" rx="20" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.5"/>
    <text x="145" y="26" text-anchor="middle" class="f" font-size="16" font-weight="600" fill="#ffffff">Open source · Early development</text>
  </g>
</svg>
