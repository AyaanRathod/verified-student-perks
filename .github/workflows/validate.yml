name: Validate deals

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate_deals.py data/deals.yaml
      - run: python scripts/validate_deals.py --candidates data/inbox/candidates.yaml
      - run: python tests/test_phase1.py
