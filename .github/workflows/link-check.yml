name: Nightly link check

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - id: check
        run: python scripts/check_links.py
      - name: Open or update issue
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: "Link check: deals need review"
          ISSUE_LABEL: link-check
          REPORT_PATH: data/inbox/link-report.md
          FAILED: ${{ steps.check.outputs.failed }}
          FINGERPRINT: ${{ steps.check.outputs.fingerprint }}
        with:
          script: |
            const fs = require('fs');
            const title = process.env.ISSUE_TITLE;
            const label = process.env.ISSUE_LABEL;
            const failed = Number(process.env.FAILED || '0');
            const fingerprint = process.env.FINGERPRINT || '';
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8').slice(0, 60000);
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'B60205' });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 30,
            });
            const found = existing.data.find((issue) => issue.title === title);
            function oldFingerprint(issue) {
              const match = String(issue.body || '').match(/<!-- fingerprint: ([0-9a-f]+) -->/);
              return match ? match[1] : '';
            }
            if (failed > 0 && !found) {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            } else if (failed > 0 && found) {
              await github.rest.issues.update({ owner, repo, issue_number: found.number, body });
              if (oldFingerprint(found) !== fingerprint) {
                await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body });
              }
            } else if (failed === 0 && found) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: found.number,
                body: 'All clear. Nothing needs review.',
              });
              await github.rest.issues.update({
                owner, repo, issue_number: found.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
