name: Monday source watch

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - id: watch
        run: python scripts/check_sources.py
      - name: Open or update issue
        if: steps.watch.outputs.report == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: "Monday watch: new student-deal leads"
          ISSUE_LABEL: monday-watch
          REPORT_PATH: data/inbox/monday-report.md
        with:
          script: |
            const fs = require('fs');
            const title = process.env.ISSUE_TITLE;
            const label = process.env.ISSUE_LABEL;
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8').slice(0, 60000);
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'FBCA04' });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 30,
            });
            const found = existing.data.find((issue) => issue.title === title);
            if (found) {
              await github.rest.issues.createComment({ owner, repo, issue_number: found.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
      - name: Commit snapshot
        if: steps.watch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox/source-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Monday source snapshot"
          git push
